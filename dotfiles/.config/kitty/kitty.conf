# Copper Linux -- kitty, the session's terminal.
#
# This file is seeded into ~/.config/kitty/kitty.conf by startniri. The copy in
# your home belongs to you; the shipped copy at /usr/share/copper/niri-skel is
# only read to fill in files that are missing.
#
# Everything here is chosen to match the niri session it starts in: the same
# Tokyo Night family the focus ring and the waybar use (#7aa2f7 accent,
# #3b4261 dim), JetBrains Mono because the image ships it, and a translucent
# background so the wallpaper reads through the window. niri composites with
# alpha, so background_opacity actually does something here -- a terminal
# without a compositor would draw an opaque window and ignore it.

# --- the greeting ---------------------------------------------------------
# Every window opens with fastfetch and then hands the terminal to the user's
# shell. This is kitty's own `shell` setting, which is split into words and
# has environment variables expanded (see kitty.conf(5)), so the quoted third
# argument really is one word and the $SHELL lookup happens inside the /bin/sh
# we start. fastfetch is an ingot package, installed by startniri on the first
# session start; the `command -v` test means a terminal opened before that
# install finishes still opens, just without the greeting.
#
# The greeting deliberately does not use a shell rc file: fastfetch here is
# owned by the terminal, not by every shell, so a script, a cron-like command
# and the console on tty1 stay quiet.
shell /bin/sh -c "if command -v fastfetch >/dev/null 2>&1; then fastfetch; fi; exec ${SHELL:-/bin/sh}"

# --- transparency ---------------------------------------------------------
# 0.9 rather than lower: the wallpaper stays readable through the window and
# the text keeps its contrast on top of it. dynamic_background_opacity lets
# ctrl+shift+a followed by a key adjust it live, which is what the map below
# exposes.
background_opacity 0.9
dynamic_background_opacity yes

# --- colours (Tokyo Night, the same family as the niri config) -----------
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #283457
cursor                  #c0caf5
cursor_text_color       #1a1b26
url_color               #73daca

active_border_color     #7aa2f7
inactive_border_color   #3b4261
active_tab_background   #7aa2f7
active_tab_foreground   #1a1b26
inactive_tab_background #16161e
inactive_tab_foreground #a9b1d6
tab_bar_background      #16161e

# The 16 ANSI colours. Program output (ls, git, btop, a compiler) picks from
# these, so this is the half of the theme that decides whether the terminal
# "looks good" rather than the window chrome.
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# --- type ----------------------------------------------------------------
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
adjust_line_height 105%

# --- shape ---------------------------------------------------------------
# niri draws no server-side decorations, so the padding is the whole frame
# around the text. A little air, no title bar, and the tab bar at the bottom
# so it does not fight the bar at the top of the screen.
hide_window_decorations yes
window_padding_width    12
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_margin_width    0.0
confirm_os_window_close 0

# --- keys ----------------------------------------------------------------
# kitty's defaults already copy with ctrl+shift+c; these are the two Copper
# users reach for first, and the opacity pair matches the maps above.
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05

# --- behaviour -----------------------------------------------------------
# The bell is a sound in a VM that has just spent a boot getting audio up;
# silence is kinder, and the visual bell is not needed either.
enable_audio_bell no
# Scrollback is memory. 2000 lines is kitty's default and enough for a build
# log; the box this ships to is not the one to spend RAM on a deeper buffer.
scrollback_lines 2000
